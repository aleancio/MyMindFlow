<script>
var nome
var cognome
var user
var email
var genere
var password
var confirm_password

var underLabel



window.onload = function(){
	nome = window.document.getElementById('name')
    cognome = window.document.getElementById('surname')
    user = window.document.getElementById('username')
    email = window.document.getElementById('email')
    password = window.document.getElementById('password')
    confirm_password = window.document.getElementById('confirm_password')
    underLabel = window.document.getElementById('underLabel')
    generate();

let power = document.getElementById("power-point"); 
console.log(password)
password.oninput = function () { 
    let point = 0; 
    let value = password.value; 
    console.log(value);
    let widthPower =  
        ["1%", "25%", "50%", "75%", "100%"]; 
    let colorPower =  
        ["#D73F40", "#DC6551", "#F2B84F", "#BDE952", "#3ba62f"]; 
  
    if (value.length >= 6) { 
        let arrayTest =  [/[0-9]/, /[a-z]/, /[A-Z]/, /[^0-9a-zA-Z]/]; 
        arrayTest.forEach((item) => { 
            if (item.test(value)) { 
                point += 1; 
            } 
        }); 
    } 
    console.log(power)
    power.style.width = widthPower[point]; 
    power.style.backgroundColor = colorPower[point]; 
}






}
function sub()
{	
     if(printmsg()){
            $.ajax({
                	type : 'POST',
                    url : 'AddUtente.php',
                    data : {
            			'name' : nome.value,
                        'surname' : cognome.value,
                        'username' : user.value,
                        'email' : email.value,
                        'password' : password.value,
                        'confirm_password' : confirm_password.value
                        },
                    success : function(retPar){
                    		//result = JSON.parse(retPar);
							console.log(retPar);
                            if(retPar.includes('pass_match'))
                            {
                             underLabel.innerHTML = ' ERROR : Passwords do not match'
                            
                            } else if (retPar.includes('user_error')){
                            	
                                underLabel.innerHTML = ' ERROR : Username already used'
                            
                            
                            } else if (retPar.includes('already_exist')) {
                            	underLabel.innerHTML = 'ERROR : Your account may already exist, please follow this <a href = "https://mindflow.altervista.org/recuperaPass/inserisciEmail.php">link</a> if you do not rember your password'
                            
                            
                            } 
                            
                            else if (retPar.includes('email_already_in')) {
                            	underLabel.innerHTML = 'ERROR : Your account may already exist, please follow this <a href = "https://mindflow.altervista.org/recuperaPass/inserisciEmail.php">link</a> if you do not rember your password'

                            }
                            
                            else {

                            		window.location.replace('immagineProfilo.html');
   
                            
                            }
                            
      	         
                    }
                
                })
                } else {

                                	underLabel.innerHTML = 'Captcha was not completed'              
                 }
               
                


}


let captcha;
function generate() {

	// Clear old input
	document.getElementById("submit").value = "";

	// Access the element to store
	// the generated captcha
	captcha = document.getElementById("image");
	let uniquechar = "";

	const randomchar =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

	// Generate captcha for length of
	// 5 with random character
	for (let i = 1; i < 5; i++) {
		uniquechar += randomchar.charAt(
			Math.random() * randomchar.length)
	}

	// Store generated input
	captcha.innerHTML = uniquechar;
}

function printmsg() {
	const usr_input = document.getElementById("submit").value;

	// Check whether the input is equal
	// to generated captcha or not
	if (usr_input == captcha.innerHTML) {
		//let s = document.getElementById("key").innerHTML = "Matched";
		//generate();
        return true;
	}
	else {
		//let s = document.getElementById("key").innerHTML = "not Matched";
		generate();
        return false;
	}
}
