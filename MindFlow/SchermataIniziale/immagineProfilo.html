    .login-box {

    }

    .login-box h2 {

    }

    .login-box .user-box {
    position: relative;
    
    }

    .login-box .user-box input {

    border-bottom: 1px solid #fff;
    outline: none;

    }
    .login-box .user-box label {
    position: absolute;

    left: 0;
    padding: 10px 0;
    font-size: 1.5vw;

    pointer-events: none;
    transition: .5s;

        font-family: OstrichSans-Heavy;

    }
    .sub-button:hover{
